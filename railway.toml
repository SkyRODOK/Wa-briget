# Railway configuration — NeoChat WhatsApp Bridge
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "node server.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Catatan:
# - PORT di-inject otomatis oleh Railway
# - Volume untuk auth_info harus dibuat manual di dashboard (lihat DEPLOY-RAILWAY.md)
# - Set variable AUTH_DIR=/data/auth_info agar sesi WA tidak hilang saat redeploy
